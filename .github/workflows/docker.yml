name: Build and push container images

# Builds the deployment's two images and pushes them to the GitHub Container
# Registry, so a server never has to compile Rust:
#
#   weft-weftd      the server itself, with the embedded web client and voice.
#                   `voice` is integral to the image: it bundles the webrtc SFU
#                   AND the §16 M-lk-3b libwebrtc media relay (cross-network
#                   calls / federated voice carry audio without exposing a
#                   client's IP to the peer network).
#   weft-matrix     the Matrix bridge daemon — the `matrix` Compose profile.
#                   Published for the same reason: it rides ruma, which is a
#                   long compile to ask of a small VPS.
#
# Runs on pushes to the default branch, on version tags (v1.2.3), and manual
# dispatch.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io with the built-in token

    strategy:
      # Independent images: a broken bridge build must not hide a good weftd one.
      fail-fast: false
      matrix:
        include:
          - image: weft-weftd
            dockerfile: deploy/weftd/Dockerfile
          - image: weft-matrix
            dockerfile: deploy/weft-matrix/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags/labels: :latest on the default branch, :<version> on a tag,
      # plus :sha-<commit> always. The image name is lowercased automatically.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache across runs so the heavy Rust + web + libwebrtc build only
          # rebuilds what changed. Scoped per image — one shared cache key would
          # have the two builds evicting each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
