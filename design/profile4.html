<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; background: #313338; font-family: 'Inter', sans-serif; }
        input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:9999px; background:#3f4147; outline:none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#5865f2; cursor:pointer; border:2px solid #fff; }
        input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#5865f2; cursor:pointer; border:2px solid #fff; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#3f4147; border-radius:3px; }
        .toast { transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s ease; }
        .toast-hidden { transform:translateY(100%); opacity:0; pointer-events:none; }
        .av-overlay { opacity:0; transition:opacity 0.15s; }
        .av-wrap:hover .av-overlay { opacity:1; }
        textarea { resize:none; }
        input, textarea, button { font-family:'Inter',sans-serif; }
        ::placeholder { color:#4e5058; }
    </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    const DEFAULT_PROFILE = {
        displayName: "Mira Voss", username: "miravoss",
        bio: "just vibing and shipping code at 2am \u{1F319}\nopen source enthusiast \u00B7 coffee-fueled dev",
        status: "online", customStatus: "\u{1F3A7} lofi & grind",
        avatarUrl: null, bannerColor: "#5865f2",
    };

    const STATUS_CONFIG = {
        online:    { label:"Online",         color:"#23a55a" },
        idle:      { label:"Idle",           color:"#f0b232" },
        dnd:       { label:"Do Not Disturb", color:"#f23f43", dnd:true },
        invisible: { label:"Invisible",      color:"#80848e" },
    };

    const BANNER_COLORS = ["#5865f2","#eb459e","#fee75c","#57f287","#ed4245","#23a55a","#3ba55c","#faa61a","#9b59b6","#1abc9c"];
    const CANVAS_SIZE = 320, CROP_RADIUS = 128;

    function StatusDot({ status, size=12 }) {
        const cfg = STATUS_CONFIG[status];
        return (
            <span style={{ position:"relative", display:"inline-flex", width:size, height:size, borderRadius:"50%", backgroundColor:cfg.color, flexShrink:0, outline:"2.5px solid #2b2d31", outlineOffset:0 }}>
          {cfg.dnd && <span style={{ position:"absolute", top:"50%", left:"15%", right:"15%", height:size*0.28, transform:"translateY(-50%)", backgroundColor:"#2b2d31", borderRadius:9999 }}/>}
                {status==="idle" && <span style={{ position:"absolute", width:size*0.55, height:size*0.55, top:-size*0.08, left:-size*0.05, backgroundColor:"#2b2d31", borderRadius:"50%" }}/>}
        </span>
        );
    }

    function Avatar({ url, name, size=80, status }) {
        const initials = name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
        return (
            <div style={{ position:"relative", display:"inline-flex", width:size, height:size }}>
                <div style={{ width:size, height:size, borderRadius:"50%", overflow:"hidden", display:"flex", alignItems:"center", justifyContent:"center", background:url?undefined:"#5865f2", fontSize:size*0.32, fontWeight:700, color:"#fff", userSelect:"none" }}>
                    {url ? <img src={url} alt={name} style={{ width:"100%", height:"100%", objectFit:"cover" }}/> : initials}
                </div>
                {status && <span style={{ position:"absolute", bottom:0, right:0 }}><StatusDot status={status} size={size*0.28}/></span>}
            </div>
        );
    }

    function CropModal({ imageUrl, onConfirm, onCancel }) {
        const canvasRef=useRef(null), imgRef=useRef(null), dragRef=useRef(null);
        const [zoom,setZoom]=useState(1);
        const [offset,setOffset]=useState({x:0,y:0});

        const draw = useCallback(()=>{
            const canvas=canvasRef.current, img=imgRef.current;
            if(!canvas||!img) return;
            const ctx=canvas.getContext("2d");
            ctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
            const iw=img.width*zoom, ih=img.height*zoom;
            const x=CANVAS_SIZE/2-iw/2+offset.x, y=CANVAS_SIZE/2-ih/2+offset.y;
            ctx.drawImage(img,x,y,iw,ih);
            ctx.fillStyle="rgba(0,0,0,0.65)"; ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
            ctx.globalCompositeOperation="destination-out";
            ctx.beginPath(); ctx.arc(CANVAS_SIZE/2,CANVAS_SIZE/2,CROP_RADIUS,0,Math.PI*2); ctx.fill();
            ctx.globalCompositeOperation="source-over";
            ctx.save(); ctx.beginPath(); ctx.arc(CANVAS_SIZE/2,CANVAS_SIZE/2,CROP_RADIUS,0,Math.PI*2); ctx.clip();
            ctx.drawImage(img,x,y,iw,ih); ctx.restore();
            ctx.strokeStyle="#5865f2"; ctx.lineWidth=2.5;
            ctx.beginPath(); ctx.arc(CANVAS_SIZE/2,CANVAS_SIZE/2,CROP_RADIUS,0,Math.PI*2); ctx.stroke();
        },[zoom,offset]);

        useEffect(()=>{
            const img=new Image();
            img.onload=()=>{ imgRef.current=img; setZoom(Math.max((CROP_RADIUS*2)/img.width,(CROP_RADIUS*2)/img.height)); };
            img.src=imageUrl;
        },[imageUrl]);

        useEffect(()=>{ draw(); },[draw]);

        const onMD=e=>{ dragRef.current={x:e.clientX-offset.x,y:e.clientY-offset.y}; };
        const onMM=e=>{ if(dragRef.current) setOffset({x:e.clientX-dragRef.current.x,y:e.clientY-dragRef.current.y}); };
        const onMU=()=>{ dragRef.current=null; };
        const onWheel=e=>{ e.preventDefault(); setZoom(z=>Math.max(0.3,Math.min(4,z-e.deltaY*0.001))); };

        const confirm=()=>{
            const img=imgRef.current; if(!img) return;
            const out=document.createElement("canvas"); out.width=CROP_RADIUS*2; out.height=CROP_RADIUS*2;
            const ctx=out.getContext("2d");
            ctx.beginPath(); ctx.arc(CROP_RADIUS,CROP_RADIUS,CROP_RADIUS,0,Math.PI*2); ctx.clip();
            const iw=img.width*zoom, ih=img.height*zoom;
            ctx.drawImage(img, CANVAS_SIZE/2-iw/2+offset.x-(CANVAS_SIZE/2-CROP_RADIUS), CANVAS_SIZE/2-ih/2+offset.y-(CANVAS_SIZE/2-CROP_RADIUS), iw, ih);
            onConfirm(out.toDataURL("image/png"));
        };

        function ModalBtn({ onClick, bg, hbg, children }) {
            const [h,setH]=useState(false);
            return <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
                           style={{ flex:1, padding:"11px 0", borderRadius:12, background:h?hbg:bg, color:"#fff", border:"none", cursor:"pointer", fontSize:14, fontWeight:600, transition:"background 0.15s" }}>{children}</button>;
        }

        return (
            <div onClick={e=>e.target===e.currentTarget&&onCancel()} style={{ position:"fixed", inset:0, zIndex:50, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.78)", backdropFilter:"blur(5px)" }}>
                <div style={{ background:"#2b2d31", borderRadius:18, padding:28, width:440, maxWidth:"94vw", display:"flex", flexDirection:"column", gap:20, boxShadow:"0 28px 70px rgba(0,0,0,0.65)" }}>
                    <div>
                        <div style={{ fontFamily:"Outfit,sans-serif", fontWeight:700, fontSize:19, color:"#fff" }}>Crop Profile Picture</div>
                        <div style={{ color:"#949ba4", fontSize:13, marginTop:4 }}>Drag to reposition · Scroll or use slider to zoom</div>
                    </div>
                    <div style={{ display:"flex", justifyContent:"center" }}>
                        <canvas ref={canvasRef} width={CANVAS_SIZE} height={CANVAS_SIZE}
                                style={{ borderRadius:12, cursor:"grab", userSelect:"none", display:"block" }}
                                onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU} onWheel={onWheel}/>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#949ba4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        <input type="range" min="0.3" max="4" step="0.01" value={zoom} onChange={e=>setZoom(parseFloat(e.target.value))} style={{ flex:1 }}/>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#949ba4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </div>
                    <div style={{ display:"flex", gap:10 }}>
                        <ModalBtn onClick={onCancel} bg="#3f4147" hbg="#4a4d57">Cancel</ModalBtn>
                        <ModalBtn onClick={confirm} bg="#5865f2" hbg="#4752c4">Apply</ModalBtn>
                    </div>
                </div>
            </div>
        );
    }

    function ProfilePreview({ profile }) {
        return (
            <div style={{ width:300, borderRadius:16, overflow:"hidden", background:"#111214", boxShadow:"0 20px 50px rgba(0,0,0,0.5)", fontFamily:"Inter,sans-serif", userSelect:"none" }}>
                <div style={{ height:88, background:profile.bannerColor }}/>
                <div style={{ padding:"0 16px", position:"relative" }}>
                    <div style={{ position:"absolute", top:-40 }}>
                        <div style={{ borderRadius:"50%", padding:4, background:"#111214", display:"inline-flex" }}>
                            <Avatar url={profile.avatarUrl} name={profile.displayName} size={72} status={profile.status}/>
                        </div>
                    </div>
                </div>
                <div style={{ display:"flex", justifyContent:"flex-end", padding:"10px 16px 0" }}>
                    <div style={{ width:32, height:32, borderRadius:"50%", background:"#2b2d31", display:"flex", alignItems:"center", justifyContent:"center" }}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dbdee1" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                    </div>
                </div>
                <div style={{ padding:"8px 16px 16px" }}>
                    <div style={{ fontFamily:"Outfit,sans-serif", fontWeight:700, fontSize:20, color:"#fff", lineHeight:1.2 }}>{profile.displayName||"Display Name"}</div>
                    <div style={{ color:"#949ba4", fontSize:13, marginTop:2 }}>{profile.username}</div>
                    {profile.customStatus && (
                        <div style={{ marginTop:8, display:"flex", alignItems:"center", gap:6 }}>
                            <StatusDot status={profile.status} size={9}/>
                            <span style={{ color:"#c4c9d4", fontSize:12 }}>{profile.customStatus}</span>
                        </div>
                    )}
                    <div style={{ marginTop:12, borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:12 }}>
                        <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#949ba4", marginBottom:6 }}>About Me</div>
                        <div style={{ color:"#dbdee1", fontSize:13, lineHeight:1.6, whiteSpace:"pre-line", minHeight:20 }}>
                            {profile.bio || <span style={{ color:"#949ba4", fontStyle:"italic" }}>No bio set.</span>}
                        </div>
                    </div>
                    <div style={{ marginTop:12, borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:12 }}>
                        <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#949ba4", marginBottom:6 }}>Member Since</div>
                        <div style={{ color:"#dbdee1", fontSize:13 }}>Jul 26, 2024</div>
                    </div>
                </div>
            </div>
        );
    }

    function SectionLabel({ children }) {
        return <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#949ba4" }}>{children}</div>;
    }

    function TextInput({ value, onChange, placeholder, multiline, maxLength }) {
        const [focused,setFocused]=useState(false);
        const base={ width:"100%", background:"#1e1f22", color:"#dbdee1", border:`2px solid ${focused?"#5865f2":"transparent"}`, borderRadius:10, padding:"10px 14px", fontSize:14, outline:"none", transition:"border-color 0.15s" };
        const onFocus=()=>setFocused(true), onBlur=()=>setFocused(false);
        const onHoverIn=e=>{ if(!focused) e.target.style.borderColor="rgba(88,101,242,0.4)"; };
        const onHoverOut=e=>{ if(!focused) e.target.style.borderColor="transparent"; };
        return multiline
            ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} maxLength={maxLength} rows={4}
                        onFocus={onFocus} onBlur={onBlur} onMouseEnter={onHoverIn} onMouseLeave={onHoverOut}
                        style={{...base, lineHeight:1.6, resize:"none"}}/>
            : <input type="text" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} maxLength={maxLength}
                     onFocus={onFocus} onBlur={onBlur} onMouseEnter={onHoverIn} onMouseLeave={onHoverOut}
                     style={base}/>;
    }

    function App() {
        const [saved,setSaved]=useState(DEFAULT_PROFILE);
        const [draft,setDraft]=useState(DEFAULT_PROFILE);
        const [cropSrc,setCropSrc]=useState(null);
        const fileRef=useRef(null);
        const isDirty=JSON.stringify(saved)!==JSON.stringify(draft);
        const set=(k,v)=>setDraft(d=>({...d,[k]:v}));
        const [hovSave,setHovSave]=useState(false);
        const [hovRevert,setHovRevert]=useState(false);

        const onFile=e=>{
            const f=e.target.files?.[0]; if(!f) return;
            const r=new FileReader(); r.onload=ev=>setCropSrc(ev.target.result); r.readAsDataURL(f); e.target.value="";
        };

        return (
            <div style={{ minHeight:"100vh", background:"#313338", fontFamily:"Inter,sans-serif" }}>
                <div className={"toast"+(isDirty?"":" toast-hidden")} style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:40, padding:"0 20px 18px" }}>
                    <div style={{ maxWidth:680, margin:"0 auto", background:"#111214", border:"1px solid rgba(255,255,255,0.1)", borderRadius:14, padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:16, boxShadow:"0 20px 60px rgba(0,0,0,0.7)" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                            <span style={{ width:8, height:8, borderRadius:"50%", background:"#f0b232", display:"inline-block", flexShrink:0 }}/>
                            <span style={{ color:"#dbdee1", fontSize:14, fontWeight:500 }}>You have unsaved changes</span>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                            <button onClick={()=>setDraft(saved)} onMouseEnter={()=>setHovRevert(true)} onMouseLeave={()=>setHovRevert(false)}
                                    style={{ display:"flex", alignItems:"center", gap:6, padding:"8px 16px", borderRadius:10, background:hovRevert?"rgba(255,255,255,0.06)":"transparent", color:hovRevert?"#dbdee1":"#949ba4", border:"none", cursor:"pointer", fontSize:13, fontWeight:500, transition:"all 0.15s" }}>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                Revert
                            </button>
                            <button onClick={()=>setSaved(draft)} onMouseEnter={()=>setHovSave(true)} onMouseLeave={()=>setHovSave(false)}
                                    style={{ display:"flex", alignItems:"center", gap:6, padding:"8px 18px", borderRadius:10, background:hovSave?"#1f9450":"#23a55a", color:"#fff", border:"none", cursor:"pointer", fontSize:13, fontWeight:600, transition:"background 0.15s" }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                Save Changes
                            </button>
                        </div>
                    </div>
                </div>

                <div style={{ padding:"36px 40px 16px" }}>
                    <h1 style={{ fontFamily:"Outfit,sans-serif", fontWeight:700, fontSize:26, color:"#fff", margin:0 }}>Edit Profile</h1>
                    <p style={{ color:"#949ba4", fontSize:14, margin:"6px 0 0" }}>Changes preview live — save when you're ready.</p>
                </div>

                <div style={{ padding:"0 40px 110px", display:"flex", gap:32, alignItems:"flex-start", flexWrap:"wrap" }}>
                    <div style={{ flex:1, minWidth:300, maxWidth:560, display:"flex", flexDirection:"column", gap:14 }}>

                        <div style={{ background:"#2b2d31", borderRadius:16, overflow:"hidden" }}>
                            <div style={{ height:88, background:draft.bannerColor, position:"relative" }}>
                                <span style={{ position:"absolute", bottom:8, left:20, fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"rgba(255,255,255,0.4)" }}>Banner Color</span>
                            </div>
                            <div style={{ padding:"0 20px 20px" }}>
                                <div style={{ display:"flex", alignItems:"flex-end", gap:16, marginTop:-32, marginBottom:16 }}>
                                    <div className="av-wrap" onClick={()=>fileRef.current?.click()} style={{ position:"relative", cursor:"pointer", flexShrink:0 }}>
                                        <div style={{ borderRadius:"50%", padding:4, background:"#2b2d31", display:"inline-flex" }}>
                                            <Avatar url={draft.avatarUrl} name={draft.displayName} size={76}/>
                                        </div>
                                        <div className="av-overlay" style={{ position:"absolute", inset:0, borderRadius:"50%", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.62)", gap:3, paddingTop:4 }}>
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                            <span style={{ color:"#fff", fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.05em" }}>Change</span>
                                        </div>
                                    </div>
                                    <div style={{ paddingBottom:4, display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                                        <button onClick={()=>fileRef.current?.click()} style={{ background:"none", border:"none", cursor:"pointer", color:"#5865f2", fontSize:13, fontWeight:600, padding:0 }}
                                                onMouseEnter={e=>e.target.style.textDecoration="underline"} onMouseLeave={e=>e.target.style.textDecoration="none"}>Upload new photo</button>
                                        {draft.avatarUrl && <>
                                            <span style={{ color:"#4e5058" }}>·</span>
                                            <button onClick={()=>set("avatarUrl",null)} style={{ background:"none", border:"none", cursor:"pointer", color:"#f23f43", fontSize:13, fontWeight:500, padding:0 }}
                                                    onMouseEnter={e=>e.target.style.textDecoration="underline"} onMouseLeave={e=>e.target.style.textDecoration="none"}>Remove</button>
                                        </>}
                                    </div>
                                </div>
                                <SectionLabel>Banner Color</SectionLabel>
                                <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:8 }}>
                                    {BANNER_COLORS.map(c=>(
                                        <button key={c} onClick={()=>set("bannerColor",c)} title={c}
                                                style={{ width:28, height:28, borderRadius:"50%", background:c, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", transform:draft.bannerColor===c?"scale(1.18)":"scale(1)", outline:draft.bannerColor===c?`2.5px solid ${c}`:"none", outlineOffset:2.5, transition:"transform 0.12s" }}>
                                            {draft.bannerColor===c && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                                        </button>
                                    ))}
                                    <label title="Custom color" style={{ width:28, height:28, borderRadius:"50%", border:"2px dashed #4e5058", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", transition:"border-color 0.15s", position:"relative" }}
                                           onMouseEnter={e=>e.currentTarget.style.borderColor="#949ba4"} onMouseLeave={e=>e.currentTarget.style.borderColor="#4e5058"}>
                                        <input type="color" value={draft.bannerColor} onChange={e=>set("bannerColor",e.target.value)} style={{ opacity:0, position:"absolute", width:0, height:0 }}/>
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#949ba4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div style={{ background:"#2b2d31", borderRadius:16, padding:20, display:"flex", flexDirection:"column", gap:10 }}>
                            <SectionLabel>Display Name</SectionLabel>
                            <TextInput value={draft.displayName} onChange={v=>set("displayName",v)} placeholder="Your display name" maxLength={32}/>
                            <div style={{ textAlign:"right", fontSize:11, color:"#4e5058" }}>{draft.displayName.length}/32</div>
                        </div>

                        <div style={{ background:"#2b2d31", borderRadius:16, padding:20, display:"flex", flexDirection:"column", gap:10 }}>
                            <SectionLabel>About Me</SectionLabel>
                            <TextInput value={draft.bio} onChange={v=>set("bio",v)} placeholder="Tell the world a little about yourself..." maxLength={190} multiline/>
                            <div style={{ textAlign:"right", fontSize:11, color:"#4e5058" }}>{draft.bio.length}/190</div>
                        </div>

                        <div style={{ background:"#2b2d31", borderRadius:16, padding:20, display:"flex", flexDirection:"column", gap:14 }}>
                            <SectionLabel>Status</SectionLabel>
                            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                                {Object.entries(STATUS_CONFIG).map(([key,cfg])=>{
                                    const active=draft.status===key;
                                    return (
                                        <button key={key} onClick={()=>set("status",key)}
                                                style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderRadius:12, background:active?"rgba(88,101,242,0.15)":"#1e1f22", border:`2px solid ${active?"#5865f2":"transparent"}`, color:active?"#fff":"#949ba4", cursor:"pointer", fontSize:13, fontWeight:500, transition:"all 0.15s" }}
                                                onMouseEnter={e=>{ if(!active){e.currentTarget.style.background="#3f4147";e.currentTarget.style.color="#dbdee1";}}}
                                                onMouseLeave={e=>{ if(!active){e.currentTarget.style.background="#1e1f22";e.currentTarget.style.color="#949ba4";}}}>
                                            <StatusDot status={key} size={10}/>{cfg.label}
                                        </button>
                                    );
                                })}
                            </div>
                            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                                <SectionLabel>Custom Status</SectionLabel>
                                <TextInput value={draft.customStatus} onChange={v=>set("customStatus",v)} placeholder="What's on your mind?" maxLength={128}/>
                            </div>
                        </div>
                    </div>

                    <div style={{ position:"sticky", top:24, display:"flex", flexDirection:"column", gap:10 }}>
                        <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#949ba4" }}>Preview</div>
                        <ProfilePreview profile={draft}/>
                        {isDirty && <div style={{ textAlign:"center", fontSize:12, color:"#f0b232", marginTop:2 }}>Unsaved changes</div>}
                    </div>
                </div>

                <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }} onChange={onFile}/>
                {cropSrc && <CropModal imageUrl={cropSrc} onConfirm={url=>{set("avatarUrl",url);setCropSrc(null);}} onCancel={()=>setCropSrc(null)}/>}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
