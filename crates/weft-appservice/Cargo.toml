[package]
name = "weft-appservice"
version.workspace = true
# Not published to crates.io: workspace-internal, path deps only.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WEFT App-Service SDK: the base for building a `remote` plugin (and the Matrix bridge). Connection + AUTH ADAPTER handshake + registration + dispatch loop + Ctx. See docs/architecture/plugin-spec.md §3.5. A client library, not part of the server."

# M-plug-0: skeleton — the builder shape only. The wire types (weft-proto, M-plug-1)
# and the transport/dispatch loop (weft-transport, tokio, M-plug-2) wire in then.
# The `bridge` feature (realm/provisioning helpers, §18) arrives with M-plug-11.
[features]
bridge = []

[dependencies]
weft-crypto = { path = "../weft-crypto" }
anyhow = { workspace = true }
