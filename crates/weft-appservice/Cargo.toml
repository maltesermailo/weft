[package]
name = "weft-appservice"
version.workspace = true
# Not published to crates.io: workspace-internal, path deps only.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WEFT App-Service SDK: the base for building a `remote` plugin (and the Matrix bridge). Connection + AUTH ADAPTER handshake + registration + dispatch loop + Ctx. See docs/architecture/plugin-spec.md §3.5. A client library, not part of the server."

[dependencies]
weft-proto = { path = "../weft-proto" }
weft-crypto = { path = "../weft-crypto" }
# `insecure-client` mirrors weft-tui: an adapter is a dev/ops-side client, and
# verified-TLS dialing is the weftd-side concern (see `weftd::dialer`).
weft-transport = { path = "../weft-transport", features = ["insecure-client"] }
tokio = { workspace = true }
quinn = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# `BanList` is serializable because the adapter MUST persist it (weftd never
# re-sends a ban) — the SDK ships the type, the adapter picks the storage.
serde = { workspace = true }
# Flow-step values are decoded from the wire's CBOR into JSON for the adapter.
serde_json = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
