[package]
name = "weft-matrix"
version.workspace = true
publish = false
edition.workspace = true
# NOT the workspace 1.75: ruma tracks recent stable. This crate is the external
# daemon, excluded from the MSRV CI job exactly like weftd's `voice` feature —
# the server's build promise is untouched (option 1, owner decision 2026-08-05).
rust-version = "1.85"
license.workspace = true
description = "WEFT–Matrix bridge daemon (adapter #1 of the Foreign-Realm Bridging Framework): an appservice to a companion homeserver on one side, a weft-appservice provider session on the other. docs/architecture/matrix.md is the design; docs/protocol/bridge-session-protocol.md the WEFT-side wire contract."

[dependencies]
weft-appservice = { path = "../weft-appservice" }
weft-proto = { path = "../weft-proto" }
weft-crypto = { path = "../weft-crypto" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# The daemon's state store — Postgres, like everything else in this repo
# (owner directive 2026-08-06: no flat-file storage). Runtime queries only.
sqlx = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
# rustls only (ring provider comes from the workspace's rustls policy); no
# default features keeps native-tls/openssl out of the tree.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Types only — identifiers and event (de)serialization. The HTTP plumbing is
# reqwest above; matrix-sdk was considered and rejected (client-framework
# mismatch, e2ee dead weight — see docs/architecture/matrix.md decision 1).
ruma = { version = "0.16", features = ["events", "rand"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
