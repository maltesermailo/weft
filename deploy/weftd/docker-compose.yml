name: weft

# weftd + PostgreSQL + LiveKit (voice). That is the whole server; two optional
# stacks sit next to it and reach it over PUBLISHED PORTS, not a shared network:
#
#   ../caddy/        TLS + reverse proxy in front of this stack
#   ../weft-matrix/  the Matrix bridge and its companion homeserver
#
# Separate projects on purpose: each is independently deployable, and neither can
# break this one by failing to start. The price is that ports have to be published
# where the other stacks can reach them — see WEFT_HTTP_BIND in `.env`.
#
# Edit weft.toml (weftd), livekit.yaml (LiveKit keys) and `.env` (the Postgres
# password + which ports are published), then `docker compose up -d`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: weft
      # From `.env`, the one place it is written: weft.toml references it as
      # `${POSTGRES_PASSWORD}` and weftd expands `${VAR}` from the environment when
      # it loads the file. `:?` makes an unset value a startup error rather than an
      # empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: weft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft -d weft"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # RTC media — direct to the host, never proxied.
      - "50000-50020:50000-50020/udp"
      # Signalling. Published because Caddy fronts it from another project; weftd
      # itself reaches it internally on `livekit:7880`.
      - "${LIVEKIT_BIND:-0.0.0.0}:${LIVEKIT_PORT:-7880}:7880"

  weftd:
    # The published image (built + pushed by .github/workflows/docker.yml). Pull it
    # with `docker compose pull weftd`. The `build:` block below still lets you
    # build locally with the same tag (`docker compose build weftd`).
    image: ghcr.io/maltesermailo/weft-weftd:latest
    build:
      context: ../..
      dockerfile: deploy/weftd/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      # weft.toml's [storage] url references this.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./weft.toml:/etc/weft/weft.toml:ro
      # §13 uploaded media blobs — persists across restarts (matches weft.toml's
      # [media] dir). Without this, uploads vanish on restart.
      - weftd_media:/var/lib/weft/media
      # QUIC cannot be reverse-proxied, so weftd holds its own certificate. This is
      # Caddy's data directory from ../caddy, bind-mounted read-only: weftd reads
      # the cert Caddy obtained (see [tls] in weft.toml) and hot-reloads it on
      # renewal. Delete this line if you terminate TLS some other way — see
      # README.md → Standalone TLS.
      - ../caddy/data:/data:ro
    ports:
      # QUIC, for desktop/native clients. Cannot be proxied — it is UDP + TLS 1.3
      # end to end, so it is published directly whatever else is in front.
      - "4433:4433/udp"
      # The HTTP surface: the web client, same-origin /ws, /.well-known/weft,
      # /media. Plain HTTP — see `.env` for who should be able to reach it.
      - "${WEFT_HTTP_BIND:-0.0.0.0}:${WEFT_HTTP_PORT:-8081}:8081"

volumes:
  pgdata:
  weftd_media:
