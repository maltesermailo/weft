name: weft

# Full weft deployment: weftd (embedded web client) + PostgreSQL + LiveKit
# (voice) + Caddy (TLS + reverse proxy), and — optionally — the Matrix bridge.
# Edit the config files:
#   - weft.toml         (weftd)
#   - livekit.yaml      (LiveKit keys)
#   - Caddyfile         (domains)
#   - weft-matrix.toml  (the bridge)      ┐ only with the `matrix` profile
#   - homeserver.yaml   (Synapse)         ┘ see MATRIX.md
#   - POSTGRES_* below
# `docker compose up -d --build`.
#
# ── Profiles (COMPOSE_PROFILES in `.env`) ─────────────────────────────────
#   caddy   the bundled reverse proxy (automatic Let's Encrypt on 80/443)
#   matrix  the Matrix bridge: Synapse (companion homeserver) + the daemon
#   setup   one-shot helpers, never started by `up` — invoked with
#           `docker compose run --rm <service>`
#
# The bridge is one profile rather than a separate stack because it needs to
# reach weftd (`weftd:4433` for QUIC, `weftd:8081` for media): same project,
# same network, no external-network wiring. Leave `matrix` out and none of it
# is built or run.
#
# WEFT_HTTP_BIND/WEFT_HTTP_PORT choose where weftd's HTTP port is published. To
# run WITHOUT Caddy (HTTP straight on the host), set COMPOSE_PROFILES= and
# WEFT_HTTP_BIND=0.0.0.0 in `.env`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # MUST MATCH the storage.url in weft.toml.
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: change-me-postgres-password
      POSTGRES_DB: weft
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `matrix` profile's two databases — Synapse's needs the `C`
      # collation, which POSTGRES_DB cannot express. Runs ONLY on a fresh data
      # volume; MATRIX.md has the equivalent psql for an existing one. Harmless
      # without the bridge: two unused databases.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft -d weft"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "50000-50020:50000-50020/udp"    # rtc media (direct, not proxied)

  weftd:
    # The published image (built + pushed by .github/workflows/docker.yml). Pull
    # it with `docker compose pull weftd`. The `build:` block below still lets you
    # build locally with the same tag (`docker compose build weftd`) if you'd
    # rather not use the registry.
    image: ghcr.io/maltesermailo/weft-weftd:latest
    build:
      context: ../..
      dockerfile: deploy/weftd/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - ./weft.toml:/etc/weft/weft.toml:ro
      # §13 uploaded media blobs — persists across restarts (matches
      # weft.toml [media] dir). Without this, images vanish on restart.
      - weftd_media:/var/lib/weft/media
      # Caddy's data (incl. its LE certs) mounted read-only at the same path Caddy
      # uses (/data), so weftd can read the cert for QUIC (see weft.toml [tls]).
      - caddy_data:/data:ro
    ports:
      - "4433:4433/udp"        # QUIC control plane (desktop/native clients)
      # weftd's HTTP listener (plain HTTP: web client, /ws, /.well-known, /media).
      # Defaults to 127.0.0.1 — loopback only, so it's NOT exposed while Caddy
      # fronts it on 443. Set WEFT_HTTP_BIND=0.0.0.0 in .env (with COMPOSE_PROFILES
      # empty) to advertise it on the host directly, without Caddy.
      - "${WEFT_HTTP_BIND:-127.0.0.1}:${WEFT_HTTP_PORT:-8081}:8081"

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Only starts when the "caddy" profile is active (COMPOSE_PROFILES in .env,
    # the default). Clear COMPOSE_PROFILES to run without the reverse proxy.
    profiles: ["caddy"]
    depends_on:
      - weftd
      - livekit
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3 for the web client (optional)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # LE certs live here; shared read-only with weftd
      - caddy_config:/config

  # ── the Matrix bridge (profile: matrix) ──────────────────────────────────
  # Design: docs/architecture/matrix.md. Setup walkthrough: MATRIX.md.

  # The companion homeserver: dedicated to the bridge, registration disabled, its
  # only users the bridge bot and its puppets — which is what lets the appservice
  # claim the whole `@weft_*` namespace (matrix.md §2).
  #
  # Synapse rather than conduwuit because appservice registration must be
  # declarative (`app_service_config_files`); conduwuit registers appservices
  # through its admin room.
  synapse:
    image: ghcr.io/element-hq/synapse:latest
    profiles: ["matrix"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NOT under /data: that is the state volume, and this file is a read-only
      # bind mount. Nesting them means the chown below cannot touch it (`chown:
      # Read-only file system`) and every path is one mount inside another for no
      # reason. Every path *inside* homeserver.yaml is absolute, so Synapse does
      # not care where the config itself lives.
      SYNAPSE_CONFIG_PATH: /etc/synapse/homeserver.yaml
    # The image's start.py drops privileges to 991:991 via gosu, but with
    # SYNAPSE_CONFIG_PATH set ("run" mode) it does NOT chown the data directory —
    # it only does that in its `generate`/`migrate_config` modes. A named volume
    # starts out root-owned, so Synapse would fail on its first write:
    # `PermissionError: '/data/log.config'`. Chown before handing over, then exec
    # the normal entrypoint so the gosu drop still happens (Synapse never runs as
    # root). Recursive so it also repairs anything an earlier root-run left
    # behind; after first boot everything is 991 and the walk costs nothing.
    entrypoint: ["/bin/sh", "-c", "chown -R 991:991 /data && exec /start.py"]
    volumes:
      - ./homeserver.yaml:/etc/synapse/homeserver.yaml:ro
      # Ours, not Synapse-generated: the generated one logs to a file at the
      # process CWD (`/`), which the 991 user cannot write. See the file.
      - ./synapse-log.config:/etc/synapse/log.config:ro
      - synapse_data:/data
      # Read-only: the registration is generated (see the `registration`
      # one-shot), never edited here.
      - appservices:/appservices:ro
    ports:
      # Client + federation API. Keep it on loopback when Caddy fronts it;
      # Matrix federation needs real TLS on a public name, which Caddy provides.
      - "${MATRIX_BIND:-127.0.0.1}:${MATRIX_PORT:-8008}:8008"
    healthcheck:
      # Python rather than curl: the image is guaranteed to have the former.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/_matrix/client/versions')\"",
        ]
      interval: 5s
      timeout: 5s
      # Generous: a first start runs the database migrations.
      retries: 60

  bridge:
    # Published by .github/workflows/docker.yml, same as weftd — `docker compose
    # pull bridge`. The build block is the local-build alternative. `registration`
    # below shares the tag, so there is one image either way.
    image: ghcr.io/maltesermailo/weft-matrix:latest
    build:
      context: ../..
      dockerfile: deploy/weftd/Dockerfile.matrix
    profiles: ["matrix"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
      weftd:
        condition: service_started
    volumes:
      - ./weft-matrix.toml:/etc/weft/weft-matrix.toml:ro
      # The adapter's Ed25519 key — the identity weftd pins. NOT recoverable
      # from anywhere else; losing it means generating a new one and re-pinning.
      - matrix_keys:/var/lib/weft-matrix
    # Not published: only the homeserver calls it, at the `as_url` in
    # weft-matrix.toml (`http://bridge:9010` on this network).
    expose:
      - "9010"

  # ── setup one-shots (profile: setup — never started by `up`) ─────────────

  # Generate the appservice registration from weft-matrix.toml into the volume
  # Synapse reads. Generated rather than hand-written so the tokens live in
  # exactly one place instead of two files that drift.
  #   docker compose run --rm registration
  registration:
    image: ghcr.io/maltesermailo/weft-matrix:latest
    build:
      context: ../..
      dockerfile: deploy/weftd/Dockerfile.matrix
    profiles: ["setup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "weft-matrix generate-registration /etc/weft/weft-matrix.toml > /appservices/weft-matrix.yaml && echo wrote /appservices/weft-matrix.yaml"
    volumes:
      - ./weft-matrix.toml:/etc/weft/weft-matrix.toml:ro
      - appservices:/appservices

volumes:
  pgdata:
  weftd_media:
  caddy_data:
  caddy_config:
  # matrix profile
  synapse_data:
  matrix_keys:
  # Shared: written by `registration`, read by Synapse.
  appservices:
