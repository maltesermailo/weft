name: weft

# weftd + PostgreSQL + LiveKit (voice) + Caddy (TLS + reverse proxy).
#
# Caddy is in HERE rather than beside it because weftd needs the certificate, not
# just the proxy: QUIC cannot be reverse-proxied — it is UDP + TLS 1.3 end to end —
# so weftd terminates it itself and reads the cert out of Caddy's `caddy_data`
# volume. A shared named volume needs one project.
#
# The Matrix bridge IS a separate stack (`../weft-matrix/`): it needs nothing from
# in here, and reaches weftd over its public name like any third-party appservice.
#
# Edit weft.toml (weftd), livekit.yaml (LiveKit keys), Caddyfile (your domains) and
# `.env`, then `docker compose up -d`. Set `COMPOSE_PROFILES=` in `.env` to run
# without Caddy — see README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: weft
      # From `.env`, the one place it is written: weft.toml references it as
      # `${POSTGRES_PASSWORD}` and weftd expands `${VAR}` from the environment when
      # it loads the file. `:?` makes an unset value a startup error rather than an
      # empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: weft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft -d weft"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # RTC media — direct to the host, never proxied. Signalling is NOT published:
      # Caddy fronts it from inside this project, on `livekit:7880`.
      - "50000-50020:50000-50020/udp"

  weftd:
    # The published image (built + pushed by .github/workflows/docker.yml). Pull it
    # with `docker compose pull weftd`. The `build:` block below still lets you
    # build locally with the same tag (`docker compose build weftd`).
    image: ghcr.io/maltesermailo/weft-weftd:latest
    build:
      context: ../..
      dockerfile: deploy/weftd/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      # weft.toml's [storage] url references this.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./weft.toml:/etc/weft/weft.toml:ro
      # §13 uploaded media blobs — persists across restarts (matches weft.toml's
      # [media] dir). Without this, uploads vanish on restart.
      - weftd_media:/var/lib/weft/media
      # QUIC cannot be reverse-proxied, so weftd holds its own certificate: Caddy's
      # data volume, read-only, is where it finds the one Caddy obtained (see [tls]
      # in weft.toml). Hot-reloaded on renewal, no restart. This shared volume is
      # the reason Caddy lives in this project. Harmless with Caddy disabled —
      # weftd falls back to a self-signed placeholder; README.md → Standalone TLS.
      - caddy_data:/data:ro
    ports:
      # QUIC, for desktop/native clients. Cannot be proxied — it is UDP + TLS 1.3
      # end to end, so it is published directly whatever else is in front.
      - "4433:4433/udp"
      # The HTTP surface: the web client, same-origin /ws, /.well-known/weft, /media.
      # Plain HTTP, and Caddy reaches it from inside this project — so the default
      # binds LOOPBACK and nothing on the network can touch it. `.env` covers running
      # without Caddy, where this is what you publish instead.
      - "${WEFT_HTTP_BIND:-127.0.0.1}:${WEFT_HTTP_PORT:-8081}:8081"

  caddy:
    image: caddy:2-alpine
    # Optional: `COMPOSE_PROFILES=` in `.env` runs the stack without it, for when
    # something else already terminates TLS. weftd then needs its own certificate —
    # README.md → Standalone TLS.
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      weftd:
        condition: service_started
      livekit:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3.
      - "443:443/udp"
    extra_hosts:
      # So a hand-added site block can reach a service in ANOTHER Compose project
      # through the host — the Matrix bridge's homeserver being the case that comes
      # up (../weft-matrix/README.md). weftd and livekit are in here and resolve by
      # service name, needing none of this.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates + the ACME account key. BACK THIS UP — and note weftd mounts it
      # read-only above, which is why the two share a project.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  weftd_media:
  caddy_data:
  caddy_config:
