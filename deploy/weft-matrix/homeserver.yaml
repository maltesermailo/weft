# The companion homeserver: a dedicated Matrix server whose only users are the
# bridge bot and its puppets (matrix.md §2). That is what lets the appservice
# claim the whole `@weft_*` namespace, so a puppet is `@weft_<ulid>:<domain>`
# with no second prefix.
#
# **Synapse, not conduwuit** — because appservice registration must be
# declarative (`app_service_config_files` below). conduwuit registers
# appservices through its admin room, which is a manual step this deployment
# deliberately does not have. matrix.md decision 1 lists Synapse as supported.
#
# The signing key and any other missing file are written on first boot, into the
# `synapse_data` volume — nothing to run by hand. See README.md.

# The MXID suffix — `@weft_<ulid>:<server_name>` — NOT the hostname this server
# runs on. The two are independent, so there are two valid shapes:
#
#   1. server_name = the subdomain it actually serves ("matrix.weft.example").
#      Nothing else to configure. This is the default here.
#   2. server_name = the apex ("weft.example") while the server runs at
#      matrix.weft.example. Prettier MXIDs, but it REQUIRES delegation:
#      `https://weft.example/.well-known/matrix/server` must return
#      {"m.server": "matrix.weft.example:443"}. That path is on the apex, which
#      in this stack is weftd's Caddy site block, not the matrix one — see
#      README.md's "Federation and TLS".
#
# MUST MATCH [matrix] domain in weft-matrix.toml either way, and it is
# PERMANENT: baked into every MXID and event this server signs, so changing it
# later invalidates all of them.
server_name: "matrix.weft.example"

pid_file: /data/homeserver.pid
media_store_path: /data/media_store

# Generated on first boot if absent. BACK IT UP: this is the identity remote
# homeservers pin, and it is also what `macaroon_secret_key` is derived from when
# unset — which is why `Config is missing macaroon_secret_key` in the log is a
# benign warning, not something to fix.
signing_key_path: /data/signing.key

# `log_config` is deliberately ABSENT. Set it, and Synapse generates a config that
# logs to a rotating file at `abspath("homeserver.log")` — the process working
# directory, which is `/` in this image and unwritable by the 991 user it drops to
# (a hard startup failure). Unset, it installs a plain StreamHandler: logs go to
# stderr, `docker compose logs synapse` shows them, nothing accumulates in the
# volume. That is what a container wants. Level is INFO; to get DEBUG you have to
# mount a real log config and point `log_config` at it.

listeners:
  - port: 8008
    type: http
    tls: false
    # `x_forwarded` because a reverse proxy terminates TLS in front (see the
    # README's Caddyfile snippet).
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: change-me-synapse-postgres-password
    database: synapse
    # The stack's shared Postgres. Synapse needs a C-collation database;
    # initdb/10-matrix.sql creates it that way on a fresh volume.
    host: postgres
    cp_min: 5
    cp_max: 10

# ── The appservice registration ────────────────────────────────────────────
# THIS is the config-based registration. The file is produced by
# `weft-matrix generate-registration` into a volume both containers share, so
# the tokens cannot drift from weft-matrix.toml by being copied twice.
app_service_config_files:
  - /appservices/weft-matrix.yaml

# Dedicated to the bridge: nobody signs up here. The appservice creates puppets
# through its own token, which bypasses this.
enable_registration: false

# Serve the public room directory to OTHER homeservers. Synapse defaults this to
# false, which makes a projected namespace undiscoverable from anywhere else: a
# user on another server who adds this one under Element's "add a new server"
# gets an empty list, even though the Space is published locally. Outbound
# projection exists to be found, so it is on here. Only rooms explicitly
# published to the directory are exposed — which is the projected Spaces, and
# nothing the bridge merely consumes.
allow_public_rooms_over_federation: true

# ── Federation ─────────────────────────────────────────────────────────────
# ON, and it has to be: remote homeservers reaching projected Spaces is the point
# of outbound projection, and joining remote rooms is the point of consuming
# them. It is NOT restricted here — adding `federation_domain_whitelist: []`
# would confine the bridge to rooms on this server (useful only for a first
# smoke test without public TLS).
#
# What federation actually needs from the deployment:
#   1. `server_name` resolvable in public DNS, with real TLS on 443. The Caddy
#      Caddy in the weftd stack does that — uncomment its matrix block
#      (../weftd/Caddyfile).
#   2. Delegation, so remote servers use 443 instead of 8448. `serve_server_
#      wellknown` below has Synapse answer `/.well-known/matrix/server` itself,
#      which works as long as `https://<server_name>/` routes here. With an apex
#      `server_name` it does NOT — the apex serves weftd — so the delegation goes
#      in Caddy's weftd block instead. See the Caddyfile.
#   3. Nothing on 8448. That is what (2) buys.
serve_server_wellknown: true

report_stats: false

# Federation needs somewhere to fetch other servers' signing keys. matrix.org is
# the historical default, but the default is going away — the startup warning says
# so — and an unset value is one more thing to discover later. Stated explicitly,
# warning suppressed.
trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true

# A bridge-only server needs no presence or URL previews, and both are cost.
presence:
  enabled: false
url_preview_enabled: false
